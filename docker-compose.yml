services:

  keycloak-db:
    image: "postgres:16.1-bullseye"
    container_name: "keycloak-db"
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${KEYCLOAK_DB}"
      POSTGRES_USER: "${KEYCLOAK_DB_USER}"
      POSTGRES_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
    volumes:
      - ./keycloak/keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U ${KEYCLOAK_DB_USER}
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  keycloak:
    image: "quay.io/keycloak/keycloak:23.0"
    container_name: "keycloak"
    restart: unless-stopped
    environment:
      KC_DB: "postgres"
      KC_DB_URL: "jdbc:postgresql://keycloak-db/${KEYCLOAK_DB}"
      KC_DB_USERNAME: "${KEYCLOAK_DB_USER}"
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
      KC_HTTP_PORT: "${KEYCLOAK_PORT}"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN_USER}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      KEYCLOAK_RULESHAKE_STUDIO_CLIENT_ID: "${KEYCLOAK_RULESHAKE_STUDIO_CLIENT_ID}"
      KEYCLOAK_RULESHAKE_STUDIO_CLIENT_SECRET: "${KEYCLOAK_RULESHAKE_STUDIO_CLIENT_SECRET}"
      KEYCLOAK_RULESHAKE_ORGANIZATION: "${KEYCLOAK_RULESHAKE_ORGANIZATION}"
      RULESHAKE_STUDIO_PORT: "${RULESHAKE_STUDIO_PORT}"
    command: start-dev --import-realm
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
    ports:
      - "${KEYCLOAK_PORT}:${KEYCLOAK_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/${KEYCLOAK_PORT};echo -e \"GET /health/ready HTTP/1.1\r\nhost: http://localhost\r\nConnection: close\r\n\r\n\" >&3;grep \"HTTP/1.1 200 OK\" <&3"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    depends_on:
      keycloak-db:
        condition: service_healthy

  postgres:
    image: "postgres:16.1-bullseye"
    container_name: "ruleshake-postgres"
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${RULESHAKE_DB}"
      POSTGRES_USER: "${RULESHAKE_DB_USER}"
      POSTGRES_PASSWORD: "${RULESHAKE_DB_PASSWORD}"
    volumes:
      - ./postgres/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U ${RULESHAKE_DB_USER} -d ${RULESHAKE_DB}
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  studio:
    image: "ruleshake/studio:${RULESHAKE_STUDIO_VERSION}"
    container_name: "ruleshake-studio"
    restart: unless-stopped
    ports:
      - "${RULESHAKE_STUDIO_PORT}:80"
    environment:
      VITE_RULESHAKE_CATALOG_URL: "http://localhost:${RULESHAKE_SERVER_PORT}/api/catalog"
      VITE_RULESHAKE_RUNNER_URL: "http://localhost:${RULESHAKE_SERVER_PORT}/api/runner"
      VITE_RULESHAKE_REFERENTIAL_URL: "http://localhost:${RULESHAKE_SERVER_PORT}/api/referential"
      VITE_AUTH_AUTHORITY: "${KEYCLOAK_AUTHORITY}"
      RULESHAKE_STUDIO_URL: "http://localhost:${RULESHAKE_STUDIO_PORT}"
      # ribbon naming the environment in Studio, none when empty
      VITE_RULESHAKE_ENVIRONMENT: "${RULESHAKE_ENVIRONMENT_LABEL:-}"
      VITE_AUTH_CLIENT_ID: "${KEYCLOAK_RULESHAKE_STUDIO_CLIENT_ID}"
      VITE_AUTH_CLIENT_SECRET: "${KEYCLOAK_RULESHAKE_STUDIO_CLIENT_SECRET}"
    depends_on:
      keycloak:
        condition: service_healthy

  server:
    image: "ruleshake/server:${RULESHAKE_SERVER_VERSION}"
    container_name: "ruleshake-server"
    restart: unless-stopped
    ports:
      - "${RULESHAKE_SERVER_PORT}:8080"
    environment:
      POSTGRES_URL: "jdbc:postgresql://postgres:5432/${RULESHAKE_DB}"
      POSTGRES_USERNAME: "${RULESHAKE_DB_USER}"
      POSTGRES_PASSWORD: "${RULESHAKE_DB_PASSWORD}"
      OAUTH2_ISSUER_URI: "${KEYCLOAK_AUTHORITY}"
      STUDIO_ALLOWED_ORIGINS: "http://localhost:${RULESHAKE_STUDIO_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
